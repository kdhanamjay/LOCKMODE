version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduguard_mdm
      POSTGRES_USER: eduguard_user
      POSTGRES_PASSWORD: eduguard_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduguard_user -d eduguard_mdm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduguard-mdm-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://eduguard_user:eduguard_secure_password_2026@postgres:5432/eduguard_mdm
      REDIS_URL: redis://redis:6379
      JWT_SECRET: eduguard-production-enterprise-jwt-key-2026
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
